        <h1>WhereWePraying? Find a mosque and keep your daily Islamic practice close</h1>
        <p>WhereWePraying helps Muslims find a nearby mosque and stay connected to prayer. The site brings together a simple mosque finder, prayer information, Qur’an reading, an Islamic journal, and a Dua &amp; Dhikr library in one calm experience.</p>
        <h2>Find a place to pray</h2>
        <p>Use WhereWePraying to discover a mosque when you need somewhere to pray, including when you are away from your usual masjid. The goal is simple: help you find a practical nearby option and make the next prayer easier to reach.</p>
        <h2>Read the Qur’an</h2>
        <p>Continue reading the Qur’an in a focused reader with Surah navigation, Arabic text, translation and transliteration.</p>
        <h2>Journal and reflect</h2>
        <p>Keep a private Islamic journal for daily reflections, prayer tracking and good deeds. Use the journal to look back on your day and build consistent habits.</p>
        <h2>Dua &amp; Dhikr</h2>
        <p>Keep useful supplications and remembrance organised by time and purpose, including morning, evening, salah, before sleep, Qur’anic duas, istighfar and duas for the Ummah.</p>
        <p>WhereWePraying is designed as a lightweight, practical companion for Muslims who want mosque discovery, Qur’an reading, reflection, dua and dhikr in one place.</p>
